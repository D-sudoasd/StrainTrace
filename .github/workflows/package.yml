name: Python distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify sdist contents
        shell: pwsh
        run: |
          $sdist = (Get-ChildItem dist/*.tar.gz | Select-Object -First 1).FullName
          python -c "import sys, tarfile; names = [m.name.split('/', 1)[1] for m in tarfile.open(sys.argv[1], 'r:gz').getmembers() if '/' in m.name]; required = ['.zenodo.json', '.github/workflows/ci.yml', 'CONTRIBUTING.md', 'SUPPORT.md', 'examples/paired_dic_comparison.json', 'docs/validation/main_study_20261103.points.csv']; missing = [p for p in required if p not in names]; leaked = [n for n in names if 'test_desy_' in n or '/desy_' in n or '/audit_desy_' in n]; assert not missing, f'missing from sdist: {missing}'; assert not leaked, f'leaked private files in sdist: {leaked}'" $sdist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and run outside source
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/wheel-env"
          $python = "$env:RUNNER_TEMP/wheel-env/Scripts/python.exe"
          $scripts = "$env:RUNNER_TEMP/wheel-env/Scripts"
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          $sdist = (Get-ChildItem dist/*.tar.gz | Select-Object -First 1).FullName
          & $python -m pip install $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($exe in @("straintrace.exe", "ezdic-cli.exe", "straintrace-gui.exe")) {
            $exePath = Join-Path $scripts $exe
            if (!(Test-Path -LiteralPath $exePath -PathType Leaf)) { throw "Missing installed console/GUI script: $exePath" }
          }
          Set-Location $env:RUNNER_TEMP
          & $python -I -c "import importlib.resources as r, ezdic_cli, straintrace_campaign, straintrace_agent; assert ezdic_cli.SCHEMA_PATH.is_file(); assert r.files('straintrace_data').joinpath('run_config_v1.json').is_file(); assert r.files('straintrace_data').joinpath('campaign_config_v1.json').is_file()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $scripts "straintrace.exe") --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $scripts "straintrace.exe") campaign --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $scripts "straintrace.exe") agent --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $scripts "ezdic-cli.exe") --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m ezdic_cli benchmark --output wheel-benchmark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps --force-reinstall $sdist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $scripts "straintrace.exe") --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
